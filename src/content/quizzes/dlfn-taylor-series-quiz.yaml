questions:
- question: "In first-order Taylor approximation L(\u03B8 + \u0394\u03B8) \u2248 L(\u03B8\
    ) + \u2207L^T \u0394\u03B8, which direction of \u0394\u03B8 minimizes the loss\
    \ when ||\u0394\u03B8|| = \u03B7?"
  type: mcq
  options:
  - "\u0394\u03B8 = -\u03B7 * \u2207L / ||\u2207L|| (in the opposite direction of\
    \ the gradient)"
  - "\u0394\u03B8 = +\u03B7 * \u2207L / ||\u2207L|| (in the direction of the gradient)"
  - "\u0394\u03B8 orthogonal to the gradient"
  - "\u0394\u03B8 = 0"
  correctAnswer: 0
  explanation: "By Cauchy-Schwarz inequality, the inner product \u2207L^T \u0394\u03B8\
    \ is minimized when \u0394\u03B8 is directly opposite to \u2207L."
