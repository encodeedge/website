questions:
- question: What is the key difference between s.loc[x] and s.iloc[x] in Pandas?
  type: mcq
  options:
  - loc selects by explicit index label, while iloc selects by integer zero-based
    position
  - iloc selects by column name, while loc selects by row index
  - loc is only for strings, while iloc is for integers
  - loc modifies data in-place, while iloc returns a copy
  correctAnswer: 0
  explanation: .loc is label-based indexing, whereas .iloc is integer position-based
    indexing.
