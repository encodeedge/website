<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="mlBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051512" />
      <stop offset="50%" stop-color="#08201B" />
      <stop offset="100%" stop-color="#030E0C" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="surfaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#065F46" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#042F24" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="descentVector" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Filters -->
    <filter id="mlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlowML" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Patterns -->
    <pattern id="mlGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#064E3B" stroke-width="0.75" opacity="0.4" />
      <circle cx="20" cy="20" r="1" fill="#10B981" opacity="0.2" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#mlBgGrad)" />
  <rect width="100%" height="100%" fill="url(#mlGrid)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="600" cy="340" r="240" fill="#059669" opacity="0.15" filter="url(#softGlowML)" />
  <circle cx="200" cy="250" r="180" fill="#047857" opacity="0.12" filter="url(#softGlowML)" />
  <circle cx="1000" cy="300" r="200" fill="#D97706" opacity="0.1" filter="url(#softGlowML)" />

  <!-- Outer Technical Bounds -->
  <rect x="80" y="60" width="1040" height="555" rx="12" fill="none" stroke="#059669" stroke-width="0.8" stroke-dasharray="8,8" opacity="0.3" />

  <!-- 1. LEFT: Statistical Regression Plane & Clustered Scatter Data -->
  <g transform="translate(120, 160)">
    <!-- 3D Coordinate Axis Box -->
    <line x1="40" y1="280" x2="320" y2="280" stroke="#34D399" stroke-width="1.5" opacity="0.6" />
    <line x1="40" y1="280" x2="40" y2="40" stroke="#34D399" stroke-width="1.5" opacity="0.6" />
    <line x1="40" y1="280" x2="140" y2="340" stroke="#34D399" stroke-width="1.5" opacity="0.6" />

    <!-- Regression Best-Fit Hyperplane -->
    <polygon points="60,250 280,100 320,130 100,280" fill="#10B981" fill-opacity="0.18" stroke="#34D399" stroke-width="1.5" />
    <line x1="60" y1="250" x2="300" y2="115" stroke="#34D399" stroke-width="2.5" filter="url(#mlGlow)" />

    <!-- Class A: Clustered Emerald Inliers -->
    <g fill="#34D399" filter="url(#mlGlow)">
      <circle cx="80" cy="230" r="4.5" />
      <circle cx="110" cy="210" r="4" />
      <circle cx="130" cy="225" r="5" />
      <circle cx="150" cy="180" r="4.5" />
      <circle cx="170" cy="195" r="5.5" />
      <circle cx="190" cy="165" r="4" />
      <circle cx="210" cy="150" r="5" />
      <circle cx="230" cy="160" r="4.5" />
      <circle cx="250" cy="130" r="5" />
      <circle cx="280" cy="110" r="5.5" />
    </g>

    <!-- Error Residual Projections (Loss Bars) -->
    <g stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3" opacity="0.7">
      <line x1="80" y1="230" x2="80" y2="238" />
      <line x1="130" y1="225" x2="130" y2="206" />
      <line x1="170" y1="195" x2="170" y2="182" />
      <line x1="230" y1="160" x2="230" y2="146" />
    </g>

    <!-- Residual Loss Formula Badge -->
    <rect x="40" y="325" width="180" height="26" rx="6" fill="#042F24" stroke="#10B981" stroke-width="1" />
    <text x="130" y="342" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#34D399" text-anchor="middle">J(w) = 1/2m Σ (ŷ - y)²</text>
  </g>

  <!-- 2. CENTER: 3D Topographic Loss Landscape & Gradient Descent Vector Trace -->
  <g transform="translate(480, 130)">
    <!-- Contour Surface Meshes -->
    <path d="M 40,240 Q 140,80 240,160 T 440,120 T 540,240 Q 420,380 280,340 T 40,240 Z" fill="url(#surfaceGrad)" stroke="#34D399" stroke-width="1.5" opacity="0.85" />
    
    <!-- Isometric Contour Elevation Curves -->
    <path d="M 90,230 Q 160,130 250,180 T 410,160 Q 470,220 380,290 T 90,230" fill="none" stroke="#6EE7B7" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
    <path d="M 140,225 Q 190,165 260,195 T 370,185 Q 400,230 330,270 T 140,225" fill="none" stroke="#A7F3D0" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
    <path d="M 190,220 Q 230,190 280,210 Q 320,205 310,240 T 190,220" fill="none" stroke="#FDE68A" stroke-width="1.2" opacity="0.8" />

    <!-- Global Minimum Basin -->
    <ellipse cx="265" cy="225" rx="22" ry="12" fill="#064E3B" stroke="#34D399" stroke-width="2" filter="url(#mlGlow)" />
    <circle cx="265" cy="225" r="4" fill="#34D399" />

    <!-- Gradient Descent Optimization Trajectory Points & Arrows -->
    <!-- Point 1 (Start on Peak) -->
    <circle cx="100" cy="115" r="7" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5" filter="url(#mlGlow)" />
    <text x="100" y="100" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FCA5A5" text-anchor="middle">w₀ (High Loss)</text>

    <!-- Step Vector 1 -->
    <path d="M 104,120 Q 145,150 160,165" fill="none" stroke="url(#descentVector)" stroke-width="3" stroke-linecap="round" />
    <circle cx="160" cy="165" r="5" fill="#FBBF24" />

    <!-- Step Vector 2 -->
    <path d="M 160,165 Q 195,190 215,198" fill="none" stroke="url(#descentVector)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="215" cy="198" r="5" fill="#FBBF24" />

    <!-- Step Vector 3 (Basin Target) -->
    <path d="M 215,198 Q 245,215 262,223" fill="none" stroke="url(#descentVector)" stroke-width="2.5" stroke-linecap="round" filter="url(#mlGlow)" />
    <polygon points="260,221 268,225 264,217" fill="#34D399" />

    <!-- Technical Status Pill -->
    <rect x="180" y="370" width="180" height="28" rx="14" fill="#064E3B" stroke="#34D399" stroke-width="1.2" />
    <text x="270" y="388" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#34D399" text-anchor="middle">∇J(w) → 0.0001</text>
  </g>

  <!-- 3. RIGHT: Binary Decision Tree / Ensemble Forest Structure -->
  <g transform="translate(930, 160)">
    <!-- Tree Root Node -->
    <rect x="70" y="20" width="70" height="32" rx="8" fill="#064E3B" stroke="#34D399" stroke-width="2" filter="url(#mlGlow)" />
    <text x="105" y="40" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">X₁ &lt; 0.5</text>

    <!-- Branch Lines -->
    <line x1="85" y1="52" x2="35" y2="105" stroke="#34D399" stroke-width="1.5" />
    <line x1="125" y1="52" x2="175" y2="105" stroke="#34D399" stroke-width="1.5" />

    <!-- Level 1 Nodes -->
    <rect x="0" y="105" width="70" height="30" rx="8" fill="#042F24" stroke="#6EE7B7" stroke-width="1.5" />
    <text x="35" y="124" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#6EE7B7" text-anchor="middle">X₂ ≤ 12.8</text>

    <rect x="140" y="105" width="70" height="30" rx="8" fill="#042F24" stroke="#6EE7B7" stroke-width="1.5" />
    <text x="175" y="124" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#6EE7B7" text-anchor="middle">X₃ &gt; 4.1</text>

    <!-- Sub-Branch Lines -->
    <line x1="20" y1="135" x2="-5" y2="185" stroke="#10B981" stroke-width="1.2" stroke-dasharray="3,3" />
    <line x1="50" y1="135" x2="70" y2="185" stroke="#10B981" stroke-width="1.2" stroke-dasharray="3,3" />
    <line x1="155" y1="135" x2="135" y2="185" stroke="#10B981" stroke-width="1.2" stroke-dasharray="3,3" />
    <line x1="195" y1="135" x2="215" y2="185" stroke="#10B981" stroke-width="1.2" stroke-dasharray="3,3" />

    <!-- Leaf Nodes (Class Predictions) -->
    <circle cx="-5" cy="195" r="14" fill="#059669" stroke="#34D399" stroke-width="1.5" />
    <text x="-5" y="199" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">C₀</text>

    <circle cx="70" cy="195" r="14" fill="#D97706" stroke="#FBBF24" stroke-width="1.5" />
    <text x="70" y="199" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">C₁</text>

    <circle cx="135" cy="195" r="14" fill="#059669" stroke="#34D399" stroke-width="1.5" />
    <text x="135" y="199" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">C₀</text>

    <circle cx="215" cy="195" r="14" fill="#D97706" stroke="#FBBF24" stroke-width="1.5" />
    <text x="215" y="199" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">C₁</text>
  </g>

  <!-- Technical Telemetry Footer Strip -->
  <g transform="translate(140, 580)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34D399" opacity="0.6">
    <text x="0" y="0">ALGORITHM: SGD_MOMENTUM</text>
    <text x="220" y="0">LEARNING_RATE: 0.05</text>
    <text x="440" y="0">COST_FUNCTION: MSE + L2</text>
    <text x="700" y="0">METRIC: R² = 0.984</text>
  </g>
</svg>