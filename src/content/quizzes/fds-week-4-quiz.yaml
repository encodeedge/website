questions:
- question: When analyzing a frequency histogram with a long tail extending toward
    higher positive values, how is the distribution described?
  type: mcq
  options:
  - Positively skewed (right-skewed)
  - Negatively skewed (left-skewed)
  - Symmetric normal
  - Uniform
  correctAnswer: 0
  explanation: A distribution with a long right tail towards higher values is right-skewed
    (positively skewed), typically resulting in mean > median.
