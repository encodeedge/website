questions:
- question: Why is random sampling essential when estimating population characteristics?
  type: mcq
  options:
  - It ensures every member of the population has a known, non-zero probability of
    selection, minimizing systematic selection bias
  - It guarantees that sample size is always infinite
  - It eliminates all forms of variance in the data
  - It makes computation faster without needing mathematics
  correctAnswer: 0
  explanation: Random sampling prevents systematic selection bias, allowing inferential
    statistics to generalize sample observations to the broader population.
