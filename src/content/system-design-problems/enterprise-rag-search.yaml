title: "Enterprise Multi-Tenant RAG & LLM Serving"
difficulty: "Hard"
category: "AI/ML"
targetQps: 30000
readRatioPercent: 85
maxLatencyMs: 320
summary: "Design an enterprise-scale Retrieval-Augmented Generation (RAG) system capable of serving sub-second grounded answers over 20M enterprise document chunks with strict latency budgets and tenant data isolation."
functionalRequirements:
  - "Query embedding generation and sub-linear hybrid retrieval (Dense Vector + BM25 Lexical)"
  - "Cross-encoder neural reranking to condense top-100 candidates down to top-5"
  - "LLM inference generation with streaming token delivery (TTFT < 150ms)"
nonFunctionalRequirements:
  - "P99 end-to-end response latency < 320ms"
  - "Semantic response cache to prevent expensive redundant LLM generation"
  - "Graceful degradation when vector indexes or LLM endpoints experience load spikes"
hints:
  - "Calling frontier LLMs for every query costs thousands of dollars per hour. A Redis Semantic Cache eliminates up to 40% of queries for frequent enterprise questions."
  - "Separate the fast vector retrieval layer (Qdrant/Milvus on EKS) from deep neural scoring and LLM generation."
