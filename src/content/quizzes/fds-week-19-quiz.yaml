title: 'Quiz: Week 19 - Central Limit Theorem'
description: Assess your understanding of the Central Limit Theorem and sampling distributions.
passingScorePercentage: 70
markCompletedOnAttempt: true
questions:
- question: What does the Central Limit Theorem state about the distribution of sample
    mean X_bar as sample size n becomes large?
  type: mcq
  options:
  - The sampling distribution of X_bar approaches a normal distribution with mean
    mu and variance sigma^2/n, regardless of the population distribution shape
  - The sample values themselves become normally distributed
  - The standard deviation of the population shrinks to zero
  - The sample mean becomes exactly equal to zero
  correctAnswer: 0
  explanation: The CLT guarantees that the distribution of sample means converges
    to N(mu, sigma^2/n) as n increases, provided variance is finite.
