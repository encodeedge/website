  - question: "In backpropagation, what does the delta error signal (delta_l) at layer l represent?"
    type: "mcq"
    options:
      - "The partial derivative of the total loss with respect to the pre-activation input (z_l) of layer l"
      - "The change in learning rate over successive epochs"
      - "The difference between predicted probability and actual class index"
      - "The ratio of weights to biases in layer l"
    correctAnswer: 0
    explanation: "Delta_l = dL / dz_l represents the sensitivity of the final loss to perturbations in the pre-activation input of layer l."
