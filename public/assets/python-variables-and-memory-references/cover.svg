<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="vmr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1A2234" />
    </linearGradient>
    <pattern id="vmr-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
    <filter id="vmr-card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="rgba(0,0,0,0.6)" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34D399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C084FC" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#vmr-bg)" />
  <rect width="1200" height="675" fill="url(#vmr-grid)" />

  <!-- Ambient Glows -->
  <circle cx="280" cy="340" r="280" fill="#38BDF8" opacity="0.05" filter="blur(80px)" />
  <circle cx="880" cy="340" r="320" fill="#34D399" opacity="0.05" filter="blur(90px)" />
  <circle cx="600" cy="160" r="220" fill="#C084FC" opacity="0.04" filter="blur(70px)" />

  <!-- Header Section -->
  <g transform="translate(100, 56)">
    <rect x="0" y="0" width="165" height="28" rx="14" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
    <text x="82.5" y="18" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">PYTHON INTERNALS</text>
    <text x="0" y="60" fill="#FFFFFF" font-family="Georgia, serif" font-size="34" font-weight="700" letter-spacing="-0.5">Variables &amp; Memory References</text>
    <text x="0" y="86" fill="rgba(255,255,255,0.6)" font-family="system-ui, -apple-system, sans-serif" font-size="14">Understanding object allocation, memory addresses, and pointer reference counting</text>
  </g>

  <!-- Section Column Headers -->
  <g transform="translate(140, 180)">
    <text x="0" y="0" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">STACK / NAMESPACE</text>
    <text x="0" y="18" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">Variable names (Identifiers)</text>
  </g>
  <g transform="translate(720, 180)">
    <text x="0" y="0" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">HEAP / MEMORY POOL</text>
    <text x="0" y="18" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">Allocated Python Objects with ref counts</text>
  </g>

  <!-- Connecting Arrows / References -->
  <!-- var_a -> int 120 -->
  <path d="M 360 270 C 490 270, 560 270, 715 270" fill="none" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow)" />
  <!-- var_b -> int 120 (Shared reference) -->
  <path d="M 360 380 C 490 380, 560 300, 715 285" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)" opacity="0.85" />
  <!-- message -> str -->
  <path d="M 360 490 C 510 490, 580 470, 715 450" fill="none" stroke="#34D399" stroke-width="2.5" marker-end="url(#arrow-green)" />
  
  <!-- Stack Card 1: var_a -->
  <g transform="translate(140, 230)" filter="url(#vmr-card-shadow)">
    <rect width="220" height="76" rx="14" fill="#151D2C" stroke="#38BDF8" stroke-width="1.5" />
    <rect x="16" y="16" width="34" height="44" rx="8" fill="#38BDF8" fill-opacity="0.15" />
    <text x="33" y="43" fill="#38BDF8" font-family="'Courier New', monospace" font-size="18" font-weight="bold" text-anchor="middle">x</text>
    <text x="62" y="38" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="16" font-weight="bold">variable_1</text>
    <text x="62" y="55" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">name binding</text>
  </g>

  <!-- Stack Card 2: var_b (Alias) -->
  <g transform="translate(140, 340)" filter="url(#vmr-card-shadow)">
    <rect width="220" height="76" rx="14" fill="#151D2C" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1.5" />
    <rect x="16" y="16" width="34" height="44" rx="8" fill="#38BDF8" fill-opacity="0.1" />
    <text x="33" y="43" fill="#38BDF8" font-family="'Courier New', monospace" font-size="18" font-weight="bold" text-anchor="middle">y</text>
    <text x="62" y="38" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="16" font-weight="bold">variable_2</text>
    <text x="62" y="55" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">points to same id</text>
  </g>

  <!-- Stack Card 3: welcome_msg -->
  <g transform="translate(140, 450)" filter="url(#vmr-card-shadow)">
    <rect width="220" height="76" rx="14" fill="#151D2C" stroke="#34D399" stroke-width="1.5" />
    <rect x="16" y="16" width="34" height="44" rx="8" fill="#34D399" fill-opacity="0.15" />
    <text x="33" y="43" fill="#34D399" font-family="'Courier New', monospace" font-size="18" font-weight="bold" text-anchor="middle">s</text>
    <text x="62" y="38" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="16" font-weight="bold">welcome_msg</text>
    <text x="62" y="55" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">string reference</text>
  </g>

  <!-- Heap Object 1: int 120 -->
  <g transform="translate(720, 220)" filter="url(#vmr-card-shadow)">
    <rect width="360" height="120" rx="16" fill="#162032" stroke="#38BDF8" stroke-width="2" />
    <!-- Object header -->
    <rect x="16" y="14" width="80" height="22" rx="11" fill="#38BDF8" fill-opacity="0.2" />
    <text x="56" y="29" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">PyObject</text>
    <!-- Memory Address Pill -->
    <rect x="180" y="14" width="165" height="22" rx="11" fill="#0E1726" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="262.5" y="29" fill="#94A3B8" font-family="'Courier New', monospace" font-size="11" font-weight="600" text-anchor="middle">0x100f85850</text>
    
    <!-- Object Content -->
    <text x="20" y="68" fill="rgba(255,255,255,0.5)" font-family="system-ui, -apple-system, sans-serif" font-size="12">Type: <tspan fill="#FFFFFF" font-weight="bold">&lt;class 'int'&gt;</tspan></text>
    <text x="20" y="94" fill="rgba(255,255,255,0.5)" font-family="system-ui, -apple-system, sans-serif" font-size="12">Value: <tspan fill="#38BDF8" font-family="'Courier New', monospace" font-size="16" font-weight="bold">120</tspan></text>
    <text x="220" y="94" fill="rgba(255,255,255,0.5)" font-family="system-ui, -apple-system, sans-serif" font-size="12">ref_count: <tspan fill="#F59E0B" font-weight="bold">2</tspan></text>
  </g>

  <!-- Heap Object 2: str 'Hello...' -->
  <g transform="translate(720, 390)" filter="url(#vmr-card-shadow)">
    <rect width="360" height="135" rx="16" fill="#162426" stroke="#34D399" stroke-width="2" />
    <!-- Object header -->
    <rect x="16" y="14" width="80" height="22" rx="11" fill="#34D399" fill-opacity="0.2" />
    <text x="56" y="29" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">PyObject</text>
    <!-- Memory Address Pill -->
    <rect x="180" y="14" width="165" height="22" rx="11" fill="#0E1A18" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="262.5" y="29" fill="#94A3B8" font-family="'Courier New', monospace" font-size="11" font-weight="600" text-anchor="middle">0x103b24bd0</text>
    
    <!-- Object Content -->
    <text x="20" y="68" fill="rgba(255,255,255,0.5)" font-family="system-ui, -apple-system, sans-serif" font-size="12">Type: <tspan fill="#FFFFFF" font-weight="bold">&lt;class 'str'&gt;</tspan></text>
    <text x="20" y="95" fill="rgba(255,255,255,0.5)" font-family="system-ui, -apple-system, sans-serif" font-size="12">Value: <tspan fill="#34D399" font-family="'Courier New', monospace" font-size="13" font-weight="bold">"Hello welcome to python..."</tspan></text>
    <text x="220" y="120" fill="rgba(255,255,255,0.5)" font-family="system-ui, -apple-system, sans-serif" font-size="12">ref_count: <tspan fill="#34D399" font-weight="bold">1</tspan></text>
  </g>

  <!-- Bottom Interactive inspection hint -->
  <g transform="translate(140, 565)">
    <rect width="940" height="48" rx="12" fill="#0E1320" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="24" y="30" fill="#94A3B8" font-family="'Courier New', monospace" font-size="13">
      <tspan fill="#C084FC">&gt;&gt;&gt;</tspan> hex(id(variable_1)) == hex(id(variable_2))  <tspan fill="#34D399"># Returns True (Shared integer caching)</tspan>
    </text>
  </g>
</svg>

