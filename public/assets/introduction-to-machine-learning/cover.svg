<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="ml-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121824" />
      <stop offset="100%" stop-color="#1A2234" />
    </linearGradient>
    <pattern id="ml-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
    <filter id="ml-card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.55)" />
    </filter>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171F2E" />
      <stop offset="100%" stop-color="#131926" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#ml-bg)" />
  <rect width="1200" height="675" fill="url(#ml-grid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="240" cy="180" r="260" fill="#FDA4AF" opacity="0.07" filter="blur(80px)" />
  <circle cx="960" cy="380" r="300" fill="#E5E795" opacity="0.06" filter="blur(90px)" />
  <circle cx="600" cy="540" r="240" fill="#38BDF8" opacity="0.05" filter="blur(80px)" />

  <!-- Header Section -->
  <g transform="translate(100, 64)">
    <!-- Topic Pill -->
    <rect x="0" y="0" width="168" height="28" rx="14" fill="#FDA4AF" fill-opacity="0.15" stroke="#FDA4AF" stroke-opacity="0.35" stroke-width="1" />
    <text x="84" y="18" fill="#FDA4AF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">MACHINE LEARNING</text>

    <!-- Main Title -->
    <text x="0" y="68" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" letter-spacing="-0.5">Introduction to Machine Learning</text>
    
    <!-- Subtitle -->
    <text x="0" y="102" fill="rgba(255,255,255,0.65)" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">Core Foundations, Algorithmic Paradigms &amp; Mathematical Intuition</text>
  </g>

  <!-- Central Visual: 3 Core ML Paradigms -->
  <g transform="translate(100, 215)">
    <!-- Card 1: Supervised Learning -->
    <g transform="translate(0, 0)" filter="url(#ml-card-shadow)">
      <rect width="315" height="380" rx="22" fill="url(#card-grad-1)" stroke="rgba(253, 164, 175, 0.3)" stroke-width="1.5" />
      
      <!-- Card Badge -->
      <rect x="24" y="24" width="40" height="40" rx="12" fill="#FDA4AF" fill-opacity="0.15" />
      <text x="44" y="50" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">🎯</text>
      
      <text x="76" y="44" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">PARADIGM 01</text>
      <text x="76" y="58" fill="#FFFFFF" font-family="Georgia, serif" font-size="16" font-weight="700">Supervised</text>

      <!-- Diagram: Labeled Data to Function Mapping -->
      <g transform="translate(24, 88)">
        <rect width="267" height="150" rx="14" fill="#0E131F" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        
        <!-- Graph axes -->
        <line x1="30" y1="120" x2="237" y2="120" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
        <line x1="30" y1="120" x2="30" y2="25" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
        
        <!-- Regression curve -->
        <path d="M 35 110 Q 120 85, 170 55 T 235 30" fill="none" stroke="#FDA4AF" stroke-width="2.5" />
        
        <!-- Scatter points -->
        <circle cx="55" cy="100" r="4.5" fill="#FDA4AF" opacity="0.9" />
        <circle cx="85" cy="98" r="4.5" fill="#FDA4AF" opacity="0.9" />
        <circle cx="115" cy="80" r="4.5" fill="#FDA4AF" opacity="0.9" />
        <circle cx="140" cy="74" r="4.5" fill="#FDA4AF" opacity="0.9" />
        <circle cx="175" cy="50" r="4.5" fill="#FDA4AF" opacity="0.9" />
        <circle cx="210" cy="38" r="4.5" fill="#FDA4AF" opacity="0.9" />
        
        <text x="135" y="140" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="10" text-anchor="middle">y = f(x) + ε (Labeled)</text>
      </g>

      <!-- Bullet points -->
      <text x="24" y="270" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Known Ground Truth</text>
      <text x="24" y="292" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Learns mapping from input X to target Y.</text>
      
      <rect x="24" y="316" width="120" height="26" rx="8" fill="rgba(253, 164, 175, 0.1)" />
      <text x="84" y="333" fill="#FDA4AF" font-family="monospace" font-size="10.5" text-anchor="middle">Regression / Clf</text>
    </g>

    <!-- Card 2: Unsupervised Learning -->
    <g transform="translate(342, 0)" filter="url(#ml-card-shadow)">
      <rect width="315" height="380" rx="22" fill="url(#card-grad-1)" stroke="rgba(229, 231, 149, 0.3)" stroke-width="1.5" />
      
      <!-- Card Badge -->
      <rect x="24" y="24" width="40" height="40" rx="12" fill="#E5E795" fill-opacity="0.15" />
      <text x="44" y="50" fill="#E5E795" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">🌌</text>
      
      <text x="76" y="44" fill="#E5E795" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">PARADIGM 02</text>
      <text x="76" y="58" fill="#FFFFFF" font-family="Georgia, serif" font-size="16" font-weight="700">Unsupervised</text>

      <!-- Diagram: Clustering -->
      <g transform="translate(24, 88)">
        <rect width="267" height="150" rx="14" fill="#0E131F" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        
        <!-- Cluster 1 (Left top) -->
        <circle cx="80" cy="55" r="32" fill="#E5E795" fill-opacity="0.08" stroke="#E5E795" stroke-dasharray="3 3" stroke-width="1.2" />
        <circle cx="70" cy="48" r="4" fill="#E5E795" />
        <circle cx="85" cy="42" r="4" fill="#E5E795" />
        <circle cx="92" cy="58" r="4" fill="#E5E795" />
        <circle cx="72" cy="65" r="4" fill="#E5E795" />

        <!-- Cluster 2 (Right bottom) -->
        <circle cx="185" cy="85" r="34" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-dasharray="3 3" stroke-width="1.2" />
        <circle cx="175" cy="76" r="4" fill="#38BDF8" />
        <circle cx="196" cy="80" r="4" fill="#38BDF8" />
        <circle cx="180" cy="94" r="4" fill="#38BDF8" />
        <circle cx="198" cy="95" r="4" fill="#38BDF8" />

        <text x="135" y="140" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="10" text-anchor="middle">Pattern Discovery (No Labels)</text>
      </g>

      <!-- Bullet points -->
      <text x="24" y="270" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Hidden Structure Extraction</text>
      <text x="24" y="292" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Discovers manifolds, groups &amp; embeddings.</text>
      
      <rect x="24" y="316" width="120" height="26" rx="8" fill="rgba(229, 231, 149, 0.1)" />
      <text x="84" y="333" fill="#E5E795" font-family="monospace" font-size="10.5" text-anchor="middle">K-Means / PCA</text>
    </g>

    <!-- Card 3: Reinforcement Learning -->
    <g transform="translate(684, 0)" filter="url(#ml-card-shadow)">
      <rect width="315" height="380" rx="22" fill="url(#card-grad-1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
      
      <!-- Card Badge -->
      <rect x="24" y="24" width="40" height="40" rx="12" fill="#38BDF8" fill-opacity="0.15" />
      <text x="44" y="50" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">⚡</text>
      
      <text x="76" y="44" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">PARADIGM 03</text>
      <text x="76" y="58" fill="#FFFFFF" font-family="Georgia, serif" font-size="16" font-weight="700">Reinforcement</text>

      <!-- Diagram: Agent-Environment Loop -->
      <g transform="translate(24, 88)">
        <rect width="267" height="150" rx="14" fill="#0E131F" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        
        <!-- Agent Box -->
        <rect x="35" y="40" width="70" height="36" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
        <text x="70" y="62" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">AGENT</text>

        <!-- Environment Box -->
        <rect x="165" y="40" width="70" height="36" rx="8" fill="#1E293B" stroke="#34D399" stroke-width="1" />
        <text x="200" y="62" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">ENV</text>

        <!-- Action Arrow (Top) -->
        <path d="M 105 50 L 165 50" stroke="#38BDF8" stroke-width="1.5" />
        <polygon points="163,47 169,50 163,53" fill="#38BDF8" />
        <text x="135" y="42" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">action</text>

        <!-- Reward/State Arrow (Bottom) -->
        <path d="M 165 66 L 105 66" stroke="#34D399" stroke-width="1.5" />
        <polygon points="107,63 101,66 107,69" fill="#34D399" />
        <text x="135" y="80" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">reward, s'</text>

        <text x="135" y="140" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="10" text-anchor="middle">Policy Optimization Loop</text>
      </g>

      <!-- Bullet points -->
      <text x="24" y="270" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Trial, Error &amp; Reward</text>
      <text x="24" y="292" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Maximizes cumulative expected return.</text>
      
      <rect x="24" y="316" width="120" height="26" rx="8" fill="rgba(56, 189, 248, 0.1)" />
      <text x="84" y="333" fill="#38BDF8" font-family="monospace" font-size="10.5" text-anchor="middle">MDP / Q-Learn</text>
    </g>
  </g>

  <!-- Bottom Brand Watermark -->
  <g transform="translate(100, 630)">
    <circle cx="8" cy="8" r="4" fill="#E5E795" />
    <text x="22" y="12" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">ENCODEEDGE ARCHITECTURAL BLUEPRINT</text>
  </g>
</svg>
