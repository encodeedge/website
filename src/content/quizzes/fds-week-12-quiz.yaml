title: 'Quiz: Week 12 - Composition & Relational Charts'
description: Test your knowledge of stacked area graphs, heatmaps, and time series.
passingScorePercentage: 70
markCompletedOnAttempt: true
questions:
- question: When is a stacked area chart preferred over a standard multi-line plot?
  type: mcq
  options:
  - When tracking how individual component parts contribute to an overall total over
    time
  - When tracking negative values that oscillate wildly
  - When categorical variables have no time dimension
  - When plotting high-resolution 3D point clouds
  correctAnswer: 0
  explanation: Stacked area charts are ideal for displaying changes in total volume
    alongside the relative composition of its constituent segments across time.
