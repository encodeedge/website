questions:
- question: In a standard Tukey Boxplot, what distance defines the Interquartile Range
    (IQR)?
  type: mcq
  options:
  - Q3 (75th percentile) - Q1 (25th percentile)
  - Maximum - Minimum
  - Mean - Standard Deviation
  - Q2 (50th percentile) - Q1
  correctAnswer: 0
  explanation: IQR = Q3 - Q1 represents the middle 50% spread of the data.
