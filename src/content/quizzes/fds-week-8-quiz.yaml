- question: Can an array of shape (4, 1) be broadcast against an array of shape (4,
    3) in NumPy?
  type: mcq
  options:
  - Yes, because dimension 1 has size 1 and expands along the 3 columns
  - No, because the number of elements is different
  - Only if both arrays contain integers
  - Only after transposing the second array
  correctAnswer: 0
  explanation: NumPy broadcasting allows dimensions of size 1 to stretch to match
    the corresponding dimension in the other array.
