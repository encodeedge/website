- question: What is the primary difference between statistical modeling and algorithmic
    modeling?
  type: mcq
  options:
  - Statistical modeling assumes an underlying stochastic data-generating process,
    whereas algorithmic modeling treats the data mechanism as complex and learns directly
    via prediction algorithms
  - Statistical modeling only works with images, while algorithmic modeling works
    with text
  - Algorithmic modeling requires no computing hardware
  - Statistical modeling does not use probability
  correctAnswer: 0
