<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1B" />
      <stop offset="50%" stop-color="#0B1528" />
      <stop offset="100%" stop-color="#060A14" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="attnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#38BDF8" opacity="0.12" />
    </pattern>
    <pattern id="matrixGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#matrixGrid)" />
  <rect width="100%" height="100%" fill="url(#dotGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="250" cy="330" r="220" fill="#1D4ED8" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="650" cy="300" r="180" fill="#0284C7" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="980" cy="340" r="200" fill="#6366F1" opacity="0.18" filter="url(#softGlow)" />

  <!-- Geometric Coordinate Grid Lines -->
  <g stroke="#38BDF8" stroke-width="0.75" opacity="0.2">
    <line x1="100" y1="80" x2="1100" y2="80" stroke-dasharray="6,6" />
    <line x1="100" y1="595" x2="1100" y2="595" stroke-dasharray="6,6" />
    <line x1="100" y1="80" x2="100" y2="595" stroke-dasharray="6,6" />
    <line x1="1100" y1="80" x2="1100" y2="595" stroke-dasharray="6,6" />
  </g>

  <!-- 1. LEFT: Deep Convolutional Feature Tensor Stacks -->
  <g transform="translate(140, 150)">
    <!-- 3D Tensor Projection Slices -->
    <!-- Slice 3 (Back) -->
    <polygon points="40,20 180,60 180,340 40,300" fill="#0F2850" stroke="#1E40AF" stroke-width="1.5" opacity="0.7" />
    <!-- Slice 2 (Middle) -->
    <polygon points="70,50 210,90 210,370 70,330" fill="#0C3B72" stroke="#2563EB" stroke-width="1.5" opacity="0.8" />
    <!-- Slice 1 (Front) -->
    <polygon points="100,80 240,120 240,400 100,360" fill="#0E488F" stroke="#38BDF8" stroke-width="2" opacity="0.9" />

    <!-- Feature Map Grid Lines on Front Slice -->
    <path d="M 100,150 L 240,190 M 100,220 L 240,260 M 100,290 L 240,330" stroke="#38BDF8" stroke-width="1" opacity="0.4" />
    <path d="M 146,93 L 146,373 M 193,107 L 193,387" stroke="#38BDF8" stroke-width="1" opacity="0.4" />

    <!-- Active Convolutional Kernel Kernel Box -->
    <polygon points="146,163 193,176 193,246 146,233" fill="#38BDF8" fill-opacity="0.35" stroke="#38BDF8" stroke-width="2" filter="url(#glow)" />
    
    <!-- Receptive Field Projection Rays to Latent Space -->
    <line x1="193" y1="209" x2="380" y2="180" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8" />
    <line x1="193" y1="209" x2="380" y2="280" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8" />
  </g>

  <!-- 2. CENTER: Multi-Layer Perceptron Lattice & Forward Flow -->
  <g transform="translate(480, 110)">
    <!-- Interconnecting Synapse Lines -->
    <g stroke="url(#blueGlow)" stroke-width="1.5" opacity="0.6">
      <!-- Input to Hidden 1 -->
      <line x1="60" y1="100" x2="190" y2="60" />
      <line x1="60" y1="100" x2="190" y2="150" />
      <line x1="60" y1="100" x2="190" y2="240" />
      <line x1="60" y1="190" x2="190" y2="60" stroke-width="2" opacity="0.9" />
      <line x1="60" y1="190" x2="190" y2="150" stroke-width="2.5" opacity="1" filter="url(#glow)" />
      <line x1="60" y1="190" x2="190" y2="240" />
      <line x1="60" y1="190" x2="190" y2="330" />
      <line x1="60" y1="280" x2="190" y2="150" />
      <line x1="60" y1="280" x2="190" y2="240" stroke-width="2" opacity="0.9" />
      <line x1="60" y1="280" x2="190" y2="330" />
      <line x1="60" y1="370" x2="190" y2="240" />
      <line x1="60" y1="370" x2="190" y2="330" stroke-width="2" opacity="0.8" />

      <!-- Hidden 1 to Hidden 2 -->
      <line x1="190" y1="60" x2="320" y2="100" />
      <line x1="190" y1="60" x2="320" y2="200" />
      <line x1="190" y1="150" x2="320" y2="100" stroke-width="2.5" opacity="0.95" />
      <line x1="190" y1="150" x2="320" y2="200" stroke-width="2" />
      <line x1="190" y1="150" x2="320" y2="300" />
      <line x1="190" y1="240" x2="320" y2="100" />
      <line x1="190" y1="240" x2="320" y2="200" stroke-width="2" opacity="0.9" />
      <line x1="190" y1="240" x2="320" y2="300" stroke-width="2.5" opacity="1" filter="url(#glow)" />
      <line x1="190" y1="330" x2="320" y2="200" />
      <line x1="190" y1="330" x2="320" y2="300" stroke-width="2" />

      <!-- Hidden 2 to Bottleneck Latent Node -->
      <line x1="320" y1="100" x2="440" y2="160" stroke-width="2" opacity="0.8" />
      <line x1="320" y1="200" x2="440" y2="200" stroke-width="3" opacity="1" filter="url(#glow)" />
      <line x1="320" y1="300" x2="440" y2="240" stroke-width="2" opacity="0.8" />
    </g>

    <!-- Layer 1 Nodes (Input Vector) -->
    <circle cx="60" cy="100" r="14" fill="#0B1B38" stroke="#38BDF8" stroke-width="2" />
    <circle cx="60" cy="100" r="5" fill="#38BDF8" />
    <circle cx="60" cy="190" r="16" fill="#0B1B38" stroke="#38BDF8" stroke-width="2.5" filter="url(#glow)" />
    <circle cx="60" cy="190" r="7" fill="#38BDF8" />
    <circle cx="60" cy="280" r="14" fill="#0B1B38" stroke="#38BDF8" stroke-width="2" />
    <circle cx="60" cy="280" r="5" fill="#38BDF8" />
    <circle cx="60" cy="370" r="14" fill="#0B1B38" stroke="#38BDF8" stroke-width="2" />
    <circle cx="60" cy="370" r="5" fill="#38BDF8" />

    <!-- Layer 2 Nodes (Dense Hidden 1) -->
    <circle cx="190" cy="60" r="15" fill="#132347" stroke="#60A5FA" stroke-width="2" />
    <circle cx="190" cy="60" r="6" fill="#60A5FA" />
    <circle cx="190" cy="150" r="18" fill="#132347" stroke="#38BDF8" stroke-width="2.5" filter="url(#glow)" />
    <circle cx="190" cy="150" r="8" fill="#38BDF8" />
    <circle cx="190" cy="240" r="18" fill="#132347" stroke="#818CF8" stroke-width="2.5" filter="url(#glow)" />
    <circle cx="190" cy="240" r="8" fill="#818CF8" />
    <circle cx="190" cy="330" r="15" fill="#132347" stroke="#60A5FA" stroke-width="2" />
    <circle cx="190" cy="330" r="6" fill="#60A5FA" />

    <!-- Layer 3 Nodes (Dense Hidden 2) -->
    <circle cx="320" cy="100" r="16" fill="#1E1B4B" stroke="#818CF8" stroke-width="2" />
    <circle cx="320" cy="100" r="6" fill="#818CF8" />
    <circle cx="320" cy="200" r="20" fill="#1E1B4B" stroke="#C084FC" stroke-width="3" filter="url(#glow)" />
    <circle cx="320" cy="200" r="9" fill="#C084FC" />
    <circle cx="320" cy="300" r="16" fill="#1E1B4B" stroke="#818CF8" stroke-width="2" />
    <circle cx="320" cy="300" r="6" fill="#818CF8" />

    <!-- Latent Representation Core -->
    <circle cx="440" cy="200" r="24" fill="#0B132B" stroke="#38BDF8" stroke-width="3" filter="url(#glow)" />
    <circle cx="440" cy="200" r="12" fill="url(#nodeGrad)" />
  </g>

  <!-- 3. RIGHT: Transformer Attention Heatmap & Query-Key-Value Projection -->
  <g transform="translate(900, 160)">
    <!-- Attention Matrix Grid Frame -->
    <rect x="0" y="0" width="200" height="200" rx="12" fill="#0A1124" stroke="#38BDF8" stroke-width="1.5" />
    
    <!-- Heatmap Cells with Attention Weights -->
    <rect x="15" y="15" width="38" height="38" rx="4" fill="#1E40AF" opacity="0.4" />
    <rect x="60" y="15" width="38" height="38" rx="4" fill="#38BDF8" opacity="0.9" filter="url(#glow)" />
    <rect x="105" y="15" width="38" height="38" rx="4" fill="#1E40AF" opacity="0.3" />
    <rect x="150" y="15" width="38" height="38" rx="4" fill="#6366F1" opacity="0.7" />

    <rect x="15" y="60" width="38" height="38" rx="4" fill="#6366F1" opacity="0.6" />
    <rect x="60" y="60" width="38" height="38" rx="4" fill="#1E40AF" opacity="0.2" />
    <rect x="105" y="60" width="38" height="38" rx="4" fill="#38BDF8" opacity="0.95" filter="url(#glow)" />
    <rect x="150" y="60" width="38" height="38" rx="4" fill="#1E40AF" opacity="0.5" />

    <rect x="15" y="105" width="38" height="38" rx="4" fill="#38BDF8" opacity="0.8" />
    <rect x="60" y="105" width="38" height="38" rx="4" fill="#6366F1" opacity="0.7" />
    <rect x="105" y="105" width="38" height="38" rx="4" fill="#1E40AF" opacity="0.2" />
    <rect x="150" y="105" width="38" height="38" rx="4" fill="#38BDF8" opacity="0.85" filter="url(#glow)" />

    <rect x="15" y="150" width="38" height="38" rx="4" fill="#1E40AF" opacity="0.3" />
    <rect x="60" y="150" width="38" height="38" rx="4" fill="#6366F1" opacity="0.85" />
    <rect x="105" y="150" width="38" height="38" rx="4" fill="#38BDF8" opacity="0.4" />
    <rect x="150" y="150" width="38" height="38" rx="4" fill="#6366F1" opacity="0.9" filter="url(#glow)" />

    <!-- Q, K, V Projection Vectors Below -->
    <g transform="translate(10, 240)">
      <rect x="0" y="0" width="50" height="24" rx="6" fill="#1D4ED8" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.5" />
      <text x="25" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">Q</text>

      <rect x="65" y="0" width="50" height="24" rx="6" fill="#4338CA" fill-opacity="0.3" stroke="#818CF8" stroke-width="1.5" />
      <text x="90" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#818CF8" text-anchor="middle">K</text>

      <rect x="130" y="0" width="50" height="24" rx="6" fill="#7E22CE" fill-opacity="0.3" stroke="#C084FC" stroke-width="1.5" />
      <text x="155" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#C084FC" text-anchor="middle">V</text>

      <path d="M 25,0 L 25,-18 M 90,0 L 90,-18 M 155,0 L 155,-18" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.7" />
    </g>
  </g>

  <!-- Flow Arrows connecting Latent Core to Attention Heads -->
  <path d="M 940,310 C 970,310 980,260 1000,260" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6,6" opacity="0.8" />

  <!-- Subtle Bottom Ambient Status Data Stream -->
  <g transform="translate(140, 580)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8" opacity="0.6">
    <text x="0" y="0">BATCH_SIZE: 128</text>
    <text x="180" y="0">LR: 3e-4 (ADAMW)</text>
    <text x="380" y="0">HEADS: 12 (D_MODEL=768)</text>
    <text x="640" y="0">PRECISION: BF16_AMP</text>
    <text x="880" y="0">CONVERGENCE: STABLE</text>
  </g>
</svg>