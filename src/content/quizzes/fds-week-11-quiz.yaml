questions:
- question: What information does a violin plot convey that a standard box plot does
    not?
  type: mcq
  options:
  - The full kernel density estimate showing multimodality and data concentration
    across the range
  - The exact sample size
  - The p-value of a two-sample t-test
  - The correlation coefficient
  correctAnswer: 0
  explanation: A violin plot combines a boxplot with a rotated kernel density plot
    on each side, revealing bimodal peaks that a boxplot obscures.
