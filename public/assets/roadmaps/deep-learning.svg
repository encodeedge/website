<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120E1C" />
      <stop offset="100%" stop-color="#201830" />
    </linearGradient>
    <pattern id="dl-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
    <filter id="shadow-dl" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.4)" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#dl-bg)" />
  <rect width="800" height="500" fill="url(#dl-grid)" />

  <!-- Flow Lines -->
  <path d="M 160 250 L 320 250 L 480 250 L 640 250" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <path d="M 160 250 C 240 150, 400 150, 480 250" fill="none" stroke="#FDA4AF" stroke-width="3" stroke-dasharray="6 6" opacity="0.7" />
  <path d="M 320 250 C 400 350, 560 350, 640 250" fill="none" stroke="#E9D5FF" stroke-width="3" stroke-dasharray="6 6" opacity="0.7" />

  <!-- Header -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="130" height="26" rx="13" fill="#FDA4AF" opacity="0.2" />
    <text x="65" y="17" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">CURRICULUM</text>
    <text x="0" y="54" fill="#FFFFFF" font-family="Georgia, serif" font-size="28" font-weight="700" letter-spacing="-0.5">Deep Learning Path</text>
  </g>

  <!-- Node 1: Neurons & Activation -->
  <g transform="translate(90, 210)" filter="url(#shadow-dl)">
    <rect width="130" height="80" rx="16" fill="#1C182B" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#FDA4AF" />
    <text x="28" y="33" fill="#000" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">01</text>
    <text x="28" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Perceptrons</text>
    <text x="28" y="73" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="10">Activations &amp; Loss</text>
  </g>

  <!-- Node 2: Optimization -->
  <g transform="translate(260, 210)" filter="url(#shadow-dl)">
    <rect width="140" height="80" rx="16" fill="#1C182B" stroke="#FDA4AF" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#FDA4AF" />
    <text x="28" y="33" fill="#000" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">02</text>
    <text x="28" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Backprop &amp; SGD</text>
    <text x="28" y="73" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="10">Autograd, Adam</text>
  </g>

  <!-- Node 3: CNNs & Vision -->
  <g transform="translate(430, 210)" filter="url(#shadow-dl)">
    <rect width="140" height="80" rx="16" fill="#1C182B" stroke="#E9D5FF" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#E9D5FF" />
    <text x="28" y="33" fill="#000" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">03</text>
    <text x="28" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">CNNs &amp; Vision</text>
    <text x="28" y="73" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="10">Convolutions, Pooling</text>
  </g>

  <!-- Node 4: Transformers -->
  <g transform="translate(600, 210)" filter="url(#shadow-dl)">
    <rect width="140" height="80" rx="16" fill="#1C182B" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#E5E795" />
    <text x="28" y="33" fill="#000" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">04</text>
    <text x="28" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Transformers</text>
    <text x="28" y="73" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="10">Attention, LLMs</text>
  </g>
</svg>

