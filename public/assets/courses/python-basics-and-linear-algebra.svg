<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1A" />
      <stop offset="50%" stop-color="#0F1D36" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="1" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="matrixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bgGrad1)" />
  <g opacity="0.15" stroke="#38BDF8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="500" y1="0" x2="500" y2="675" />
    <line x1="700" y1="0" x2="700" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1100" y1="0" x2="1100" y2="675" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>
  <!-- Vector Geometry Graphic -->
  <g transform="translate(750, 320)" filter="url(#glow1)">
    <!-- Coordinate Axes -->
    <line x1="-180" y1="0" x2="220" y2="0" stroke="#64748B" stroke-width="2" />
    <line x1="0" y1="180" x2="0" y2="-180" stroke="#64748B" stroke-width="2" />
    <!-- Vector A -->
    <line x1="0" y1="0" x2="160" y2="-120" stroke="#38BDF8" stroke-width="4" />
    <polygon points="160,-120 145,-110 152,-128" fill="#38BDF8" />
    <!-- Vector B -->
    <line x1="0" y1="0" x2="140" y2="40" stroke="#10B981" stroke-width="4" />
    <polygon points="140,40 124,34 130,48" fill="#10B981" />
    <!-- Projection line -->
    <line x1="160" y1="-120" x2="140" y2="40" stroke="#E5E795" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
  </g>
  <!-- Text Overlay -->
  <text x="80" y="260" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#10B981" letter-spacing="3">FOUNDATIONS &amp; MATHEMATICS</text>
  <text x="80" y="330" font-family="system-ui, sans-serif" font-size="48" font-weight="900" fill="#FFFFFF">Python Basics &amp;</text>
  <text x="80" y="395" font-family="system-ui, sans-serif" font-size="48" font-weight="900" fill="url(#primaryGlow)">Linear Algebra for AI</text>
  <text x="80" y="460" font-family="system-ui, sans-serif" font-size="18" fill="#94A3B8">Colab • NumPy • Pandas • Vectors • Dot Products • Matrices</text>
</svg>