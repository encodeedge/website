<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="ragBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0919" />
      <stop offset="50%" stop-color="#170F29" />
      <stop offset="100%" stop-color="#080510" />
    </linearGradient>

    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="magentaCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="ragGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlowRAG" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Vector Space Coordinate Mesh Pattern -->
    <pattern id="ragGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2E1065" stroke-width="0.75" opacity="0.4" />
      <circle cx="20" cy="20" r="1.2" fill="#A855F7" opacity="0.25" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#ragBgGrad)" />
  <rect width="100%" height="100%" fill="url(#ragGrid)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="240" cy="300" r="200" fill="#7C3AED" opacity="0.16" filter="url(#softGlowRAG)" />
  <circle cx="600" cy="320" r="230" fill="#06B6D4" opacity="0.14" filter="url(#softGlowRAG)" />
  <circle cx="960" cy="300" r="220" fill="#EC4899" opacity="0.15" filter="url(#softGlowRAG)" />

  <!-- Outer Technical Bounds -->
  <rect x="80" y="60" width="1040" height="555" rx="12" fill="none" stroke="#A855F7" stroke-width="0.8" stroke-dasharray="6,6" opacity="0.25" />

  <!-- 1. LEFT: Document Ingestion, Chunking & Dense Embedding Model -->
  <g transform="translate(120, 150)">
    <!-- Source Document Stack -->
    <rect x="20" y="10" width="120" height="85" rx="8" fill="#1C152B" stroke="#4C1D95" stroke-width="1.5" />
    <line x1="36" y1="30" x2="100" y2="30" stroke="#7C3AED" stroke-width="2" />
    <line x1="36" y1="44" x2="120" y2="44" stroke="#6D28D9" stroke-width="1.5" />
    <line x1="36" y1="56" x2="110" y2="56" stroke="#6D28D9" stroke-width="1.5" />
    <line x1="36" y1="68" x2="80" y2="68" stroke="#6D28D9" stroke-width="1.5" />

    <!-- Chunking Flow Arrow -->
    <path d="M 80,105 L 80,145" stroke="#A855F7" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="76,143 80,151 84,143" fill="#A855F7" />

    <!-- Overlapping Document Chunks -->
    <g transform="translate(10, 155)">
      <rect x="0" y="0" width="140" height="42" rx="6" fill="#2E1B4E" stroke="#A855F7" stroke-width="1.5" />
      <text x="14" y="25" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#E9D5FF">Chunk #1 [512t]</text>

      <rect x="15" y="24" width="140" height="42" rx="6" fill="#3B185F" stroke="#C084FC" stroke-width="2" filter="url(#ragGlow)" />
      <text x="29" y="49" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#FFFFFF">Chunk #2 [512t]</text>
    </g>

    <!-- Embedding Model Transformation Core -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="170" height="75" rx="10" fill="#1C142E" stroke="#06B6D4" stroke-width="2" filter="url(#ragGlow)" />
      <text x="85" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#67E8F9" text-anchor="middle">EMBEDDING MODEL</text>
      <text x="85" y="48" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#A5F3FC" text-anchor="middle">text-embedding-3-large</text>
      <text x="85" y="64" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0891B2" text-anchor="middle">dim: 1536 float32</text>
    </g>
  </g>

  <!-- Pipeline Vector Stream Beam -->
  <path d="M 300,345 C 380,345 400,260 480,260" fill="none" stroke="url(#magentaCyan)" stroke-width="2.5" stroke-dasharray="6,4" />
  <polygon points="475,256 485,260 475,264" fill="#06B6D4" />

  <!-- 2. CENTER: High-Dimensional Vector Coordinate Space (HNSW / Cosine Similarity Index) -->
  <g transform="translate(490, 130)">
    <!-- 3D Vector Cube Space -->
    <rect x="0" y="0" width="340" height="340" rx="12" fill="#110B22" stroke="#A855F7" stroke-width="1.5" />
    <rect x="0" y="0" width="340" height="38" rx="12" fill="#1E1338" />
    <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#E9D5FF">VECTOR EMBEDDING SPACE (HNSW)</text>

    <!-- Coordinate Grid Wireframe -->
    <g stroke="#4C1D95" stroke-width="0.8" opacity="0.6">
      <line x1="40" y1="280" x2="300" y2="280" />
      <line x1="40" y1="280" x2="40" y2="60" />
      <line x1="40" y1="280" x2="120" y2="310" />
    </g>

    <!-- Cluster Alpha: Deep Learning Semantic Cluster -->
    <ellipse cx="230" cy="110" rx="45" ry="32" fill="#7C3AED" fill-opacity="0.15" stroke="#A855F7" stroke-width="1" stroke-dasharray="3,3" />
    <circle cx="210" cy="100" r="4.5" fill="#C084FC" />
    <circle cx="235" cy="115" r="5" fill="#E9D5FF" />
    <circle cx="250" cy="95" r="4" fill="#C084FC" />

    <!-- Cluster Beta: CPython & Systems Cluster -->
    <ellipse cx="90" cy="210" rx="40" ry="28" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1" stroke-dasharray="3,3" />
    <circle cx="75" cy="205" r="4" fill="#67E8F9" />
    <circle cx="95" cy="215" r="5" fill="#A5F3FC" />
    <circle cx="110" cy="195" r="4" fill="#67E8F9" />

    <!-- Query Vector: Live User Prompt (Red/Magenta) -->
    <circle cx="190" cy="230" r="7" fill="#EC4899" stroke="#FFFFFF" stroke-width="2" filter="url(#ragGlow)" />
    <text x="190" y="252" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F472B6" text-anchor="middle">q_vector</text>

    <!-- Cosine Nearest-Neighbor Projection Rays (Top-K=3) -->
    <g stroke="#06B6D4" stroke-width="1.8" filter="url(#ragGlow)">
      <line x1="190" y1="230" x2="235" y2="115" stroke-dasharray="4,3" />
      <line x1="190" y1="230" x2="210" y2="100" stroke-dasharray="4,3" />
      <line x1="190" y1="230" x2="250" y2="95" stroke-dasharray="4,3" />
    </g>

    <!-- Cosine Metric Tag -->
    <rect x="180" y="160" width="130" height="24" rx="4" fill="#042F2E" stroke="#06B6D4" stroke-width="1" />
    <text x="245" y="176" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#67E8F9" text-anchor="middle">cos_sim = 0.942</text>
  </g>

  <!-- 3. RIGHT: Augmented Prompt & LLM Agent Reasoning Core -->
  <g transform="translate(890, 140)">
    <!-- LLM Engine Core -->
    <rect x="0" y="0" width="220" height="340" rx="14" fill="#170F28" stroke="#EC4899" stroke-width="2" filter="url(#ragGlow)" />
    <rect x="0" y="0" width="220" height="42" rx="14" fill="#2E143E" />
    <text x="110" y="26" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#F472B6" text-anchor="middle">LLM REASONING CORE</text>

    <!-- System Prompt & Retrieved Context Injector -->
    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="188" height="65" rx="8" fill="#261036" stroke="#A855F7" stroke-width="1.5" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#C084FC">&lt;system_prompt&gt;</text>
      <text x="12" y="40" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">Top-3 Grounded Chunks</text>
      <text x="12" y="54" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34D399">✓ Zero Hallucination</text>
    </g>

    <!-- Multi-Step Agent Tool Calling -->
    <g transform="translate(16, 134)">
      <rect x="0" y="0" width="188" height="75" rx="8" fill="#122533" stroke="#06B6D4" stroke-width="1.5" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#67E8F9">AGENT TOOL ENGINE</text>
      <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="9" fill="#E0F2FE">→ SQL_Query()</text>
      <text x="12" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#E0F2FE">→ Web_Search()</text>
    </g>

    <!-- Streamed Output Response -->
    <g transform="translate(16, 222)">
      <rect x="0" y="0" width="188" height="96" rx="8" fill="#19152B" stroke="#EC4899" stroke-width="1.5" />
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#F472B6">SYNTHESIZED ANSWER</text>
      <line x1="12" y1="36" x2="160" y2="36" stroke="#EC4899" stroke-width="1.5" opacity="0.8" />
      <line x1="12" y1="50" x2="140" y2="50" stroke="#EC4899" stroke-width="1.5" opacity="0.8" />
      <line x1="12" y1="64" x2="170" y2="64" stroke="#EC4899" stroke-width="1.5" opacity="0.8" />
      <!-- Pulsing Typing Cursor -->
      <rect x="12" y="74" width="8" height="14" fill="#06B6D4" filter="url(#ragGlow)" />
    </g>
  </g>

  <!-- Flow Connector from Vector Space to LLM -->
  <path d="M 830,240 L 890,240" stroke="url(#magentaCyan)" stroke-width="3" stroke-linecap="round" filter="url(#ragGlow)" />

  <!-- Bottom Technical Telemetry -->
  <g transform="translate(140, 580)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C084FC" opacity="0.6">
    <text x="0" y="0">INDEX: HNSW (M=16, efConstruction=200)</text>
    <text x="360" y="0">DISTANCE: COSINE_NORMALIZED</text>
    <text x="680" y="0">CONTEXT_WINDOW: 128K TOKENS</text>
  </g>
</svg>